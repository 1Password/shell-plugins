apiVersion: v1
kind: Config
clusters:
- name: prod
  cluster:
    server: https://prod.example.com:6443
    certificate-authority: "-----BEGIN CERTIFICATE-----"
- name: dev
  cluster:
    server: https://dev.example.com:6443
    certificate-authority: bad-ca.crt
contexts:
- name: pem-path
