apiVersion: v1
kind: Config
clusters:
- name: dev
  cluster:
    server: https://dev.example.com:6443
    certificate-authority: certs/ca.crt
contexts:
- name: dev
  context:
    cluster: dev
    user: dev-admin
users:
- name: dev-admin
  user:
    client-certificate: certs/client.crt
    client-key: /etc/k8s/client.key
