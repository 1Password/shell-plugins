apiVersion: v1
kind: Config
clusters:
- name: prod
  cluster:
    server: https://prod.example.com:6443
contexts:
- name: prod
  context:
    cluster: prod
    user: prod-admin
- name: prod-kube-system
  context:
    cluster: prod
    user: prod-admin
    namespace: kube-system
users:
- name: prod-admin
  user:
    token: test-token-not-a-secret
